<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SARDO360</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,85%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,90%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,90%,1) 0, transparent 50%),
                radial-gradient(at 0% 100%, hsla(210,100%,90%,1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(160,50%,90%,1) 0, transparent 50%);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1), 0 1px 3px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.7);
        }
        
        .logo-container {
            margin-bottom: 35px;
        }
        
        .logo-container img {
            max-height: 45px;
            object-fit: contain;
            filter: brightness(0) drop-shadow(0 1px 2px rgba(0,0,0,0.1));
            opacity: 0.85;
        }
        
        .login-container h2 {
            margin: 0 0 24px 0;
            color: #1e293b;
            font-size: 24px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-size: 14px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            background: #ffffff;
        }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(99, 102, 241, 0.2);
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(99, 102, 241, 0.3);
        }
        
        .flash-messages {
            margin-bottom: 20px;
        }
        
        .flash-message {
            background: #fee2e2;
            color: #ef4444;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #fca5a5;
        }
        
        .admin-notice {
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
        }

        /* Responsive login */
        @media (max-width: 480px) {
            body {
                padding: 16px;
                height: auto;
                min-height: 100vh;
            }
            .login-container {
                padding: 32px 24px;
                border-radius: 16px;
                max-width: 100%;
            }
            .login-container h2 {
                font-size: 20px;
                margin-bottom: 20px;
            }
            .logo-container {
                margin-bottom: 24px;
            }
            .logo-container img {
                max-height: 35px;
            }
            .form-group input {
                padding: 12px 14px;
                font-size: 14px;
            }
            .btn-submit {
                padding: 12px;
                font-size: 15px;
            }
        }

        /* Windows Phone */
        @-ms-viewport {
            width: device-width;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="/static/assets/logo.png" alt="SARDO360">
        </div>
        
        <h2>Welcome Back</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="flash-message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn-submit">Sign In</button>
        </form>
        
        <div class="admin-notice">
            Secure Access Only.<br>
            If you do not have an account, please contact the administrator.
        </div>
    </div>
</body>
</html>
