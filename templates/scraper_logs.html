<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraper Logs - SARDO360</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=3.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .logs-content {
            padding: 20px 40px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-title {
            font-size: 20px;
            color: var(--primary-color);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Live indicator */
        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
        }
        .live-pill.idle { background: rgba(100, 116, 139, 0.1); color: #64748b; }

        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: currentColor;
        }
        .dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: .35; transform: scale(.8); }
        }

        /* Run cards */
        .run-card {
            background: #fff;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 12px;
            overflow: hidden;
        }
        .run-card.is-running { border-color: rgba(16, 185, 129, 0.5); }
        .run-card.is-stalled { border-color: rgba(249, 115, 22, 0.5); }
        .run-card.is-failed  { border-color: rgba(239, 68, 68, 0.35); }

        .run-head {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            cursor: pointer;
            flex-wrap: wrap;
        }
        .run-head:hover { background: #f8fafc; }

        .run-source {
            font-weight: 700;
            color: var(--primary-color);
            min-width: 130px;
        }
        .run-meta {
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .counters {
            display: flex;
            gap: 16px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .counter { text-align: center; min-width: 52px; }
        .counter .k {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .counter .v {
            display: block;
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary-color);
            font-variant-numeric: tabular-nums;
        }
        .counter .v.err { color: #dc2626; }

        /* Progress bar */
        .progress-wrap {
            width: 100%;
            padding: 0 18px 12px;
        }
        .progress-track {
            height: 6px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 999px;
            transition: width .4s ease;
            background: #94a3b8;
        }

        /* Only a genuinely RUNNING scrape gets the animated barber-pole. A finished or
           failed run must never look like work is still in progress. */
        .progress-fill.active {
            background: repeating-linear-gradient(
                45deg, #6366f1, #6366f1 10px, #818cf8 10px, #818cf8 20px);
            background-size: 200% 100%;
            animation: barber 1s linear infinite;
        }
        @keyframes barber { from { background-position: 0 0; } to { background-position: 40px 0; } }

        .progress-fill.done    { background: #10b981; }   /* solid green, always 100% */
        .progress-fill.warning { background: #f59e0b; }   /* amber: finished, but with a caveat */
        .progress-fill.stopped { background: #ef4444; }   /* red, stopped where it died */

        /* The scraper's own explanation (scrape_runs.notes) — so the user never has to
           go back to the terminal to find out WHY a run is marked suspect/failed. */
        .run-note {
            margin-top: 8px;
            font-size: 0.78rem;
            line-height: 1.5;
            color: var(--text-secondary);
            background: rgba(100, 116, 139, 0.07);
            border-left: 3px solid #94a3b8;
            padding: 8px 10px;
            border-radius: 0 6px 6px 0;
        }
        .run-note.warn {
            color: #92400e;
            background: rgba(245, 158, 11, 0.09);
            border-left-color: #f59e0b;
        }
        .run-note i { margin-right: 5px; }

        .progress-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Log console */
        .console {
            display: none;
            background: #0f172a;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12.5px;
            line-height: 1.55;
            padding: 14px 18px;
            max-height: 380px;
            overflow-y: auto;
            border-top: 1px solid #1e293b;
        }
        .console.open { display: block; }
        .log-line { white-space: pre-wrap; word-break: break-word; }
        .log-time  { color: #64748b; }
        .log-INFO    { color: #cbd5e1; }
        .log-WARNING { color: #fbbf24; }
        .log-ERROR   { color: #f87171; font-weight: 600; }
        .log-DEBUG   { color: #64748b; }
        .console-empty { color: #64748b; font-style: italic; }

        .load-earlier {
            text-align: center;
            padding: 6px;
            margin-bottom: 8px;
            color: #93c5fd;
            background: rgba(147, 197, 253, .08);
            border: 1px dashed rgba(147, 197, 253, .35);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .load-earlier:hover { background: rgba(147, 197, 253, .16); }

        .console-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            background: #1e293b;
            border-top: 1px solid #334155;
            font-size: 12px;
            color: #94a3b8;
        }
        .console-bar.hidden { display: none; }
        .console-bar select {
            width: auto; padding: 3px 8px; font-size: 12px;
            background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
        }
        .console-bar label { display: flex; align-items: center; gap: 5px; cursor: pointer; }

        .notice {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 0.88rem;
            color: #92400e;
            line-height: 1.6;
        }
        .notice strong { color: #78350f; }
        .notice code {
            background: rgba(120, 53, 15, .1);
            padding: 1px 5px; border-radius: 4px;
        }

        .empty-state {
            padding: 50px;
            text-align: center;
            color: var(--text-secondary);
        }
        .chip {
            display: inline-block;
            padding: 3px 9px;
            margin: 2px;
            border-radius: 6px;
            background: rgba(100, 116, 139, 0.12);
            color: #475569;
            font-size: 0.78rem;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <img src="/static/assets/logo.png" alt="SARDO360 Logo" id="app-logo"
                    onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
                <h1 id="logo-text" style="display:none;">SARDO360</h1>
            </div>
            <div class="stats-container">
                <div class="header-actions" style="margin-left: 20px; display: flex; gap: 10px;">
                    <a href="{{ url_for('index') }}" class="btn btn-secondary"
                        style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-arrow-left"></i> Back to Dashboard
                    </a>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="logs-content">
                <div class="page-header">
                    <h2 class="page-title"><i class="fas fa-terminal"></i> Scraper Logs &amp; Activity</h2>
                    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                        <span id="live-pill" class="live-pill idle">
                            <span class="dot"></span><span id="live-text">Idle</span>
                        </span>
                        <label style="display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--text-secondary); font-weight:600;">
                            <input type="checkbox" id="auto-refresh" checked style="width:auto; margin:0;">
                            Auto-refresh
                        </label>
                        <button id="btn-refresh" class="btn btn-secondary">
                            <i class="fas fa-rotate"></i> Refresh
                        </button>
                    </div>
                </div>

                <div id="never-reported-notice" style="display:none;" class="notice"></div>

                <div id="runs-list" style="display:flex; flex-direction:column; gap:14px;">
                    <div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i> Loading…</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // runId -> { lastId, firstId, level }  for every console the user has open
        const consoles = new Map();
        let pollTimer = null;

        const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        const fmtTime = (v) => {
            if (!v) return '—';
            const d = new Date(v);
            return isNaN(d) ? v : d.toLocaleString();
        };

        const fmtDuration = (secs) => {
            if (secs == null) return '—';
            const s = Math.max(0, Math.floor(secs));
            if (s < 60) return `${s}s`;
            const m = Math.floor(s / 60), r = s % 60;
            if (m < 60) return `${m}m ${r}s`;
            return `${Math.floor(m / 60)}h ${m % 60}m`;
        };

        const statusBadge = (run) => {
            const map = {
                running: ['status-running', 'fa-circle-notch fa-spin', 'Running'],
                stalled: ['status-suspect', 'fa-triangle-exclamation', 'Stalled'],
                completed: ['status-completed', 'fa-circle-check', 'Completed'],
                failed: ['status-failed', 'fa-circle-xmark', 'Failed'],
                suspect: ['status-suspect', 'fa-triangle-exclamation', 'Suspect'],
            };
            const [cls, icon, label] = map[run.live_status] || ['status-unknown', 'fa-question', run.live_status];
            return `<span class="status-badge ${cls}"><i class="fas ${icon}" style="margin-right:5px;"></i>${label}</span>`;
        };

        const noteHtml = (run) => run.notes
            ? `<div class="run-note"><i class="fas fa-circle-info"></i> ${esc(run.notes)}</div>` : '';

        const countersMissingHtml = (run) => run.counters_missing
            ? `<div class="run-note warn"><i class="fas fa-triangle-exclamation"></i>
                 This run processed ${run.progress_current ?? 0} properties, but reported
                 <strong>0 found / 0 new / 0 updated</strong>. The counters were never written back —
                 the work happened, the totals just weren't recorded.</div>` : '';

        const progressHtml = (run) => {
            const pct = run.progress_percent, state = run.progress_state;
            if (state === 'active' && pct != null) {
                return `<div class="progress-track"><div class="progress-fill active" style="width:${pct}%"></div></div>
                    <div class="progress-label"><i class="fas fa-circle-notch fa-spin"></i>
                        Scraping ${run.progress_current ?? 0} / ${run.progress_total ?? 0} (${pct}%)</div>
                    ${noteHtml(run)}`;
            }
            if (state === 'done') {
                return `<div class="progress-track"><div class="progress-fill done" style="width:100%"></div></div>
                    <div class="progress-label" style="color:#059669;"><i class="fas fa-circle-check"></i>
                        Finished — ${run.properties_found ?? 0} properties processed in ${fmtDuration(run.duration_seconds)}</div>
                    ${countersMissingHtml(run)}${noteHtml(run)}`;
            }
            // 'suspect': the scrape itself finished — it just skipped the delist sweep.
            // Amber, not red. It is a warning, not a crash.
            if (state === 'warning') {
                return `<div class="progress-track"><div class="progress-fill warning" style="width:${pct ?? 100}%"></div></div>
                    <div class="progress-label" style="color:#b45309;"><i class="fas fa-shield-halved"></i>
                        Scrape finished (${run.progress_current ?? 0} / ${run.progress_total ?? 0}) —
                        delist sweep skipped by the safety guard. Nothing was deleted.</div>
                    ${countersMissingHtml(run)}${noteHtml(run)}`;
            }
            if (state === 'stopped' && pct != null) {
                return `<div class="progress-track"><div class="progress-fill stopped" style="width:${pct}%"></div></div>
                    <div class="progress-label" style="color:#dc2626;"><i class="fas fa-circle-stop"></i>
                        Stopped at ${run.progress_current ?? 0} / ${run.progress_total ?? 0} (${pct}%)</div>
                    ${noteHtml(run)}`;
            }
            return noteHtml(run);
        };

        const counterHtml = (run) => `
            <div class="counter"><span class="k">Found</span><span class="v">${run.properties_found ?? 0}</span></div>
            <div class="counter"><span class="k">New</span><span class="v">${run.new_properties ?? 0}</span></div>
            <div class="counter"><span class="k">Updated</span><span class="v">${run.updated_properties ?? 0}</span></div>
            <div class="counter"><span class="k">Delisted</span><span class="v">${run.delisted_properties ?? 0}</span></div>
            <div class="counter"><span class="k">Errors</span><span class="v ${(run.errors_count || run.error_log_count) ? 'err' : ''}">${run.errors_count ?? 0}</span></div>
            <div class="counter"><span class="k">Logs</span><span class="v">${run.log_count ?? 0}</span></div>`;

        const metaHtml = (run) =>
            `#${run.id} · started ${fmtTime(run.started_at)} · ${fmtDuration(run.duration_seconds)}` +
            (run.triggered_by ? ' · ' + esc(run.triggered_by) : '');

        const cardClass = (run) =>
            run.live_status === 'running' ? 'is-running'
                : (run.live_status === 'stalled' || run.live_status === 'suspect') ? 'is-stalled'
                    : run.live_status === 'failed' ? 'is-failed' : '';

        function createCard(run) {
            const el = document.createElement('div');
            el.className = `run-card ${cardClass(run)}`;
            el.dataset.runId = run.id;
            el.innerHTML = `
                <div class="run-head" onclick="toggleConsole(${run.id})">
                    <i class="fas fa-chevron-right chev" style="color:var(--text-secondary); width:12px;"></i>
                    <span class="run-source">${esc(run.display_source || run.source_name)}</span>
                    <span class="badge-slot">${statusBadge(run)}</span>
                    <span class="run-meta">${metaHtml(run)}</span>
                    <div class="counters">${counterHtml(run)}</div>
                </div>
                <div class="progress-wrap">${progressHtml(run)}</div>
                <div class="console-bar hidden">
                    <i class="fas fa-terminal"></i>
                    <span>Log output</span>
                    <select class="level-select" onchange="changeLevel(${run.id}, this.value)">
                        <option value="">All levels</option>
                        <option value="INFO">INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                    </select>
                    <label><input type="checkbox" class="follow-chk" checked style="width:auto;margin:0;"> Follow</label>
                    <span class="line-info" style="margin-left:auto;"></span>
                </div>
                <div class="console"></div>`;
            return el;
        }

        // Update an existing card in place. Rebuilding the card would destroy the log
        // console the user is reading — and re-fetching the whole tail every 3s.
        function updateCard(el, run) {
            el.className = `run-card ${cardClass(run)}`;
            el.querySelector('.badge-slot').innerHTML = statusBadge(run);
            el.querySelector('.run-meta').textContent = metaHtml(run);
            el.querySelector('.counters').innerHTML = counterHtml(run);
            el.querySelector('.progress-wrap').innerHTML = progressHtml(run);
        }

        async function toggleConsole(runId) {
            const card = document.querySelector(`.run-card[data-run-id="${runId}"]`);
            if (!card) return;
            const consoleEl = card.querySelector('.console');
            const bar = card.querySelector('.console-bar');
            const chev = card.querySelector('.chev');

            if (consoles.has(runId)) {
                consoles.delete(runId);
                consoleEl.classList.remove('open');
                bar.classList.add('hidden');
                chev.classList.replace('fa-chevron-down', 'fa-chevron-right');
            } else {
                consoles.set(runId, { lastId: 0, firstId: null, level: '' });
                consoleEl.classList.add('open');
                bar.classList.remove('hidden');
                chev.classList.replace('fa-chevron-right', 'fa-chevron-down');
                consoleEl.innerHTML = '<div class="console-empty">Loading logs…</div>';
                await loadTail(runId);
            }
        }

        function changeLevel(runId, level) {
            const st = consoles.get(runId);
            if (!st) return;
            st.level = level;
            st.lastId = 0;
            st.firstId = null;
            loadTail(runId);
        }

        function lineEl(log) {
            const div = document.createElement('div');
            div.className = 'log-line';
            const t = new Date(log.created_at);
            const ts = isNaN(t) ? '' : t.toLocaleTimeString();
            div.innerHTML = `<span class="log-time">[${ts}]</span> ` +
                `<span class="log-${esc(log.level)}">${esc(log.level).padEnd(7)} ${esc(log.message)}</span>`;
            return div;
        }

        // Initial load: the MOST RECENT lines, like `tail -f`. Loading the first 500 of
        // 1,985 would leave the user stuck at "[40/174]" and never show the completion line.
        async function loadTail(runId) {
            const card = document.querySelector(`.run-card[data-run-id="${runId}"]`);
            const st = consoles.get(runId);
            if (!card || !st) return;
            const consoleEl = card.querySelector('.console');

            const params = new URLSearchParams();
            if (st.level) params.set('level', st.level);

            try {
                const res = await fetch(`/api/scrapers/logs/${runId}?${params}`);
                if (!res.ok) return;
                const data = await res.json();

                consoleEl.innerHTML = '';
                if (!data.logs.length) {
                    consoleEl.innerHTML = `<div class="console-empty">
                        No log output recorded for this run.<br>
                        The scraper published nothing to the <code>scrape_logs</code> table.</div>`;
                    card.querySelector('.line-info').textContent = '0 lines';
                    return;
                }

                if (data.has_more_before) {
                    const btn = document.createElement('div');
                    btn.className = 'load-earlier';
                    btn.textContent = `↑ Load earlier lines (${data.total - data.logs.length} above)`;
                    btn.onclick = (e) => { e.stopPropagation(); loadEarlier(runId); };
                    consoleEl.appendChild(btn);
                }

                data.logs.forEach(l => consoleEl.appendChild(lineEl(l)));

                st.lastId = data.last_id;
                st.firstId = data.first_id;
                card.querySelector('.line-info').textContent =
                    data.total > data.logs.length
                        ? `showing last ${data.logs.length} of ${data.total} lines`
                        : `${data.total} lines`;

                consoleEl.scrollTop = consoleEl.scrollHeight;   // jump to the end
            } catch (e) {
                console.error('log tail failed', e);
            }
        }

        // Scroll back up through older output.
        async function loadEarlier(runId) {
            const card = document.querySelector(`.run-card[data-run-id="${runId}"]`);
            const st = consoles.get(runId);
            if (!card || !st || !st.firstId) return;
            const consoleEl = card.querySelector('.console');

            const params = new URLSearchParams({ before_id: st.firstId });
            if (st.level) params.set('level', st.level);

            try {
                const res = await fetch(`/api/scrapers/logs/${runId}?${params}`);
                if (!res.ok) return;
                const data = await res.json();
                if (!data.logs.length) return;

                const prevHeight = consoleEl.scrollHeight;
                const oldBtn = consoleEl.querySelector('.load-earlier');
                if (oldBtn) oldBtn.remove();

                const frag = document.createDocumentFragment();
                if (data.has_more_before) {
                    const btn = document.createElement('div');
                    btn.className = 'load-earlier';
                    btn.textContent = '↑ Load earlier lines';
                    btn.onclick = (e) => { e.stopPropagation(); loadEarlier(runId); };
                    frag.appendChild(btn);
                }
                data.logs.forEach(l => frag.appendChild(lineEl(l)));
                consoleEl.insertBefore(frag, consoleEl.firstChild);

                st.firstId = data.first_id;
                // keep the user's eye on the same line rather than jumping
                consoleEl.scrollTop = consoleEl.scrollHeight - prevHeight;
            } catch (e) {
                console.error('load earlier failed', e);
            }
        }

        // Poll for lines appended since we last looked — appends only, never re-renders.
        async function pollNewLines(runId) {
            const card = document.querySelector(`.run-card[data-run-id="${runId}"]`);
            const st = consoles.get(runId);
            if (!card || !st || !st.lastId) return;
            const consoleEl = card.querySelector('.console');

            const params = new URLSearchParams({ after_id: st.lastId });
            if (st.level) params.set('level', st.level);

            try {
                const res = await fetch(`/api/scrapers/logs/${runId}?${params}`);
                if (!res.ok) return;
                const data = await res.json();
                if (!data.logs.length) return;

                const follow = card.querySelector('.follow-chk');
                const atBottom = consoleEl.scrollTop + consoleEl.clientHeight >= consoleEl.scrollHeight - 30;

                data.logs.forEach(l => consoleEl.appendChild(lineEl(l)));
                st.lastId = data.last_id;
                card.querySelector('.line-info').textContent = `${data.total} lines`;

                if (!follow || follow.checked || atBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
            } catch (e) {
                console.error('poll logs failed', e);
            }
        }

        async function refresh() {
            try {
                const res = await fetch('/api/scrapers/activity');
                if (!res.ok) throw new Error('activity fetch failed');
                const data = await res.json();

                // Live indicator
                const pill = document.getElementById('live-pill');
                const text = document.getElementById('live-text');
                const dot = pill.querySelector('.dot');
                if (data.active_count > 0) {
                    pill.classList.remove('idle');
                    dot.classList.add('pulse');
                    text.textContent = `${data.active_count} scraper${data.active_count > 1 ? 's' : ''} running`;
                } else {
                    pill.classList.add('idle');
                    dot.classList.remove('pulse');
                    text.textContent = 'No scrapers running';
                }

                // Scrapers that have never reported a run
                const notice = document.getElementById('never-reported-notice');
                if (data.never_reported && data.never_reported.length) {
                    notice.style.display = 'block';
                    notice.innerHTML = `
                        <strong><i class="fas fa-triangle-exclamation"></i> These scrapers have never reported a run:</strong><br>
                        ${data.never_reported.map(s => `<span class="chip">${esc(s.display_source)}</span>`).join('')}
                        <br><br>
                        They may still be running on the server — but they do <strong>not write to the
                        <code>scrape_runs</code> / <code>scrape_logs</code> tables</strong>, so this page cannot see them.`;
                } else {
                    notice.style.display = 'none';
                }

                const list = document.getElementById('runs-list');
                if (!data.runs.length) {
                    list.innerHTML = `<div class="empty-state">
                        <i class="fas fa-inbox" style="font-size:34px; opacity:.3; display:block; margin-bottom:14px;"></i>
                        No scrape runs recorded yet.</div>`;
                    scheduleNext(10000);
                    return;
                }

                const placeholder = list.querySelector('.empty-state');
                if (placeholder) placeholder.remove();

                // Update cards IN PLACE so open consoles keep their content and scroll.
                const seen = new Set();
                data.runs.forEach((run, i) => {
                    seen.add(String(run.id));
                    let card = list.querySelector(`.run-card[data-run-id="${run.id}"]`);
                    if (card) {
                        updateCard(card, run);
                    } else {
                        card = createCard(run);
                        const at = list.children[i];
                        at ? list.insertBefore(card, at) : list.appendChild(card);
                    }
                });
                list.querySelectorAll('.run-card').forEach(c => {
                    if (!seen.has(c.dataset.runId)) c.remove();
                });

                // Append any new log lines to consoles the user has open.
                for (const runId of consoles.keys()) await pollNewLines(runId);

                scheduleNext(data.active_count > 0 ? 3000 : 10000);
            } catch (e) {
                console.error(e);
                scheduleNext(10000);
            }
        }

        function scheduleNext(ms) {
            clearTimeout(pollTimer);
            if (document.getElementById('auto-refresh').checked) {
                pollTimer = setTimeout(refresh, ms);
            }
        }

        document.getElementById('btn-refresh').addEventListener('click', refresh);
        document.getElementById('auto-refresh').addEventListener('change', (e) => {
            if (e.target.checked) refresh(); else clearTimeout(pollTimer);
        });

        refresh();
    </script>
</body>

</html>
